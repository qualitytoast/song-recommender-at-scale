# Ranker improvement series at 50k, step 2, on retriever_50k. Builds on step 1 (ranker_50k_inlist, kept: 0.1209).
# Change: rerank the top 100 instead of 500, so each example's 31 wrong answers come from the retriever's top 100
# (as in Gao, Dai & Callan 2021: negatives from the target retriever's top results, reranking depth to match).

[ranker]
retriever = "configs/retriever_50k.toml"  # seed s uses runs/retriever_ranker_runs/retriever_50k/seed<s>/best.pt
train_seeds = [1]          # 1 seed per run
shortlist = 100            # was 500: rerank the retriever's top 100
search = "ivf"             # FAISS IVF index, as at 200k (at 50k, exact and IVF gave the same NDCG@10: 0.1012 vs 0.1011)
ivf_nlist = 2048           # clusters, ~4 x sqrt(166,627 songs) rounded to a power of 2
ivf_nprobe = 128           # clusters searched per window
negatives = 31             # per training window: the true song + 31 sampled from its shortlist (the top 100)
negatives_from = 100       # ... drawn from the whole shortlist
optimizer = "lazy_adamw"   # only the table rows a batch uses are updated, as in the retriever
lr = 1e-4                  # fine-tuning from the retriever's weights: 10x below the retriever's
weight_decay = 0.05
batch_size = 64            # windows per step
epochs = 20                # maximum passes over the ~121,000 part-B windows with the true song in the top 100
eval_every_examples = 24200  # ~1/5 epoch of the windows trained on
min_checks = 5
patience = 5
val_windows = 20000        # every window of the retriever's 20,000-window validation sample
train_windows = "in_shortlist"  # step 1: only windows whose true song is in the shortlist
freeze_tables = false      # the copied per-ID tables train too
features = []              # no extra per-candidate inputs
correction_hidden = 0      # the correction is a weighted sum of its inputs
exclude_input = false      # input songs can be in the shortlist
val_set = "retriever"      # validate on the retriever's validation sample
