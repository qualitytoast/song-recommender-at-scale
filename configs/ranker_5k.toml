# Ranker scaling ladder, 5k: the baseline ranker for retriever_5k. ranker_200k's settings
# with exact search (30,587 songs) and checks scaled to its 14,449 part-B windows.

[ranker]
retriever = "configs/retriever_5k.toml"  # seed s uses runs/retriever_ranker_runs/5k/retriever_5k/seed<s>/best.pt
train_seeds = [1]          # 1 seed per run
shortlist = 500            # rerank the retriever's top 500
search = "exact"           # every song scored (at 50k, exact and IVF gave the same NDCG@10: 0.1012 vs 0.1011)
ivf_nlist = 0
ivf_nprobe = 0
negatives = 31             # per training window: the true song + 31 sampled from its shortlist
negatives_from = 500       # ... drawn from the whole shortlist
optimizer = "lazy_adamw"   # only the table rows a batch uses are updated, as in the retriever
lr = 1e-4                  # fine-tuning from the retriever's weights: 10x below the retriever's
new_lr = 1e-4              # the ranker's new weights (candidate marker, position, correction): as lr
weight_decay = 0.05
batch_size = 64            # windows per step
epochs = 20                # maximum passes over the 14,449 part-B windows
eval_every_examples = 2889  # ~1/5 epoch of part-B windows
min_checks = 5
patience = 5
val_windows = 6109        # every validation window (6,109 at 5k)
train_windows = "all"      # every window, whether or not its true song is shortlisted
freeze_tables = false      # the copied per-ID tables train too
features = []              # no extra per-candidate inputs
correction_hidden = 0      # the correction is a weighted sum of its inputs
exclude_input = false      # input songs can be in the shortlist
val_set = "retriever"      # validate on the retriever's validation sample
