# Phase 3, step 5: second-stage ranker for the 50,000-playlist setup (recsys/ranker.py).
# Reranks the part-A retriever's top 500; trained on part-B windows the retriever never saw.

[ranker]
retriever = "configs/p3_50k_partA.toml"  # seed s uses runs/p3_runs/p3_50k_partA/seed<s>/best.pt
train_seeds = [1, 2]
shortlist = 500            # rerank the retriever's top 500 (held-out recall@500 62.2%, p3_50k_partA)
search = "exact"           # every song scored
ivf_nlist = 0
ivf_nprobe = 0
negatives = 31             # per training window: the true song + 31 sampled from its shortlist
negatives_from = 500       # ... drawn from the whole shortlist
optimizer = "adamw"        # regular AdamW: every table row updated every step
lr = 1e-4                  # fine-tuning from the retriever's weights: 10x below the retriever's
weight_decay = 0.05
batch_size = 64            # windows per step
epochs = 20                # maximum passes over the 302,495 part-B windows
eval_every_examples = 60000  # ~1/5 epoch of part-B windows
min_checks = 5
patience = 5
val_windows = 5000         # rerank the first 5,000 of the 20,000 validation windows each check
train_windows = "all"      # every window, whether or not its true song is shortlisted
freeze_tables = false      # the copied per-ID tables train too
features = []              # no extra per-candidate inputs
correction_hidden = 0      # the correction is a weighted sum of its inputs
exclude_input = false      # input songs can be in the shortlist
val_set = "retriever"      # validate on the retriever's validation sample
