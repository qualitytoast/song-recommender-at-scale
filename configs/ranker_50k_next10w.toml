# Stage 1 of training on the songs that belong in a playlist (next X songs), at 50k.
# Change from ranker_50k_next10w_base: the ranker's right answers are the next 10 songs, the song d steps ahead weighing 0.8^(d-1) too.

[ranker]
retriever = "configs/retriever_50k_next10w.toml"  # seed s uses runs/retriever_ranker_runs/50k/retriever_50k_next10w/seed<s>/best.pt
train_seeds = [1]          # 1 seed per run
shortlist = 100            # step 2: rerank the retriever's top 100
search = "ivf"             # FAISS IVF index, as at 200k (at 50k, exact and IVF gave the same NDCG@10: 0.1012 vs 0.1011)
ivf_nlist = 2048           # clusters, ~4 x sqrt(166,627 songs) rounded to a power of 2
ivf_nprobe = 128           # clusters searched per window
negatives = 31             # per training window: the true song + 31 sampled from its shortlist (the top 100)
negatives_from = 100       # ... drawn from the whole shortlist
optimizer = "lazy_adamw"   # only the table rows a batch uses are updated, as in the retriever
lr = 2e-4                  # was 1e-4: x sqrt(4) for 256-window batches
new_lr = 2e-4              # was 1e-4: as lr
weight_decay = 0.05
batch_size = 256           # was 64: a quarter of the steps per epoch
epochs = 20                # maximum passes over the 117,999 part-B windows with the true song in the top 100
eval_every_examples = 39400  # as its _base ranker: the same number of windows between checks (a smaller share of an epoch here: more windows have a right song shortlisted)
min_checks = 5
patience = 5
val_windows = 20000        # every window of the retriever's 20,000-window validation sample
train_windows = "in_shortlist"  # step 1: only windows whose true song is in the shortlist
freeze_tables = false      # the copied per-ID tables train too
features = ["overlap", "cooccurrence"]  # step 5c + log_after_last, log_after_context, context_with_pair
correction_hidden = 64     # was 0: a small network that can combine its inputs
exclude_input = true       # was false: songs in the retriever's input are left out of the shortlist
val_set = "separate"       # was "retriever": validation windows outside the retriever's sample
windows = "any_length"  # was "full": training, validation and held-out cases of 1 up to 10 songs
target_songs = 10  # was 1: the next 10 songs, the song d steps ahead weighing 0.8^(d-1) (those the shortlist holds)
target_decay = 0.8  # nearer songs weigh more
