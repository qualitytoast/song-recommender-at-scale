# Phase 1, experiment 3: v1_adam with AdamW (decoupled weight decay) instead of Adam.
# Only the optimizer and weight_decay differ from v1_adam.toml.

data_seed = 42           # playlist split
train_seeds = [42]       # one run per seed: starting weights, batch order, dropout

[data]
folder = "data/mpd"
max_playlists = 5000
min_playlist_len = 4   # v1 kept playlists with more than 3 tracks
min_freq = 2           # songs seen fewer times than this are dropped
song_key = "track_name"  # v1: songs identified by title, same-titled songs merge
vocab_from = "all"       # v1: song counts include held-out playlists
context_length = 10    # predict the 11th song from the previous 10
test_split = 0.1       # fraction of playlists held out
val_size = 3000        # first N held-out windows, used for early stopping
validation = "held_out_prefix"  # v1: validation = first val_size held-out windows
val_split = 0.0          # no separate validation playlists

[model]
embed_dim = 64
num_layers = 2
dropout = 0.1          # after embeddings, after attention, after feed-forward
scale_attention = false  # v1 quirk: attention scores not divided by sqrt(embed_dim)
init = "v1"              # v1 starting weights
features = []            # song features added to the song ID

[train]
optimizer = "adamw"    # was "adam"
lr = 1e-3             # was 0.05; Adam steps are ~lr in size, so it needs a smaller lr
weight_decay = 0.05    # was 1e-3; lr * wd = 5e-5 shrink per step, same as v1_baseline (SGD)
batch_size = 32
epochs = 40
min_epochs = 20
patience = 10
augment_mask = 0.0      # training-window augmentation off
augment_crop = 0
augment_reorder = 0.0
objective = "last_position"  # one window -> its next song
softmax = "full"          # training scores every song
sampled_negatives = 0
negative_power = 0.0      # random negatives drawn uniformly
