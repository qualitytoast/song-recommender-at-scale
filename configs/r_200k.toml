# Phase 3, scaling stage 2: second-stage ranker at 200,000 playlists (recsys/ranker.py).
# r_50k's settings with lazy AdamW and IVF search, on the 200k part-A retriever; checks scaled to its 1,470,511 part-B windows.

[ranker]
retriever = "configs/p3_200k_partA.toml"  # seed s uses runs/p3_runs/p3_200k_partA/seed<s>/best.pt
train_seeds = [1]          # 1 seed per run
shortlist = 500            # rerank the retriever's top 500 (held-out recall@500 64.0%, p3_200k_partA)
search = "ivf"             # FAISS IVF index (search benchmark: 98.6% of the exact top 500)
ivf_nlist = 2048           # clusters, ~4 x sqrt(412,404 songs) rounded to a power of 2
ivf_nprobe = 128           # clusters searched per window
negatives = 31             # per training window: the true song + 31 sampled from its shortlist
optimizer = "lazy_adamw"   # only the table rows a batch uses are updated, as in the retriever
lr = 1e-4                  # fine-tuning from the retriever's weights: 10x below the retriever's
weight_decay = 0.05
batch_size = 64            # windows per step
epochs = 20                # maximum passes over the 1,470,511 part-B windows
eval_every_examples = 294000  # ~1/5 epoch of part-B windows
min_checks = 5
patience = 5
val_windows = 20000        # every window of the retriever's 20,000-window validation sample
