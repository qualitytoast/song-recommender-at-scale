# Training speed-up: p3_50k with lazy AdamW (only the table rows a batch uses are updated; recsys/lazy_adam.py).
# Only the optimizer (and 1 seed) differ from p3_50k.toml.

data_seed = 42           # playlist split, same as every Phase 1 run
train_seeds = [1]        # 1 seed per run from now on

[data]
folder = "data/mpd_store"   # was "data/mpd": the compact store (recsys/mpd_store.py)
max_playlists = 50000  # was 5000
min_playlist_len = 4   # v1 kept playlists with more than 3 tracks
min_freq = 2           # songs seen fewer times than this are dropped
song_key = "track_uri"   # was "track_name": same-titled songs stay separate songs
vocab_from = "train"     # was "all": held-out playlists don't decide which songs exist
context_length = 10    # predict the 11th song from the previous 10
input_length = 10      # the retriever reads the window's songs only
test_split = 0.1       # fraction of playlists held out (5,000 at 50k)
validation = "separate_playlists"  # was "held_out_prefix": early stopping never sees held-out data
val_split = 0.1          # was 0.0: 80/10/10 train / validation / held-out playlists
genres_file = "data/genres/musicbrainz_all_mpd_artists.jsonl"  # was the API file: dump genres for all MPD artists
val_max_windows = 20000  # was 0 (all 156,681): ~5 s per check instead of ~41 s
test_max_windows = 0     # all held-out windows
ranker_split = 0.0       # no playlists kept back for a ranker
val_size = 0             # was 3000; unused with separate_playlists

[model]
embed_dim = 64
num_layers = 2
dropout = 0.1          # after embeddings, after attention, after feed-forward
scale_attention = true   # was false: divide attention scores by sqrt(embed_dim)
init = "pytorch"         # was "v1": PyTorch's default starting weights
features = ["artist", "album", "duration", "playlist_name", "genre"]  # was without "genre"

[train]
optimizer = "lazy_adamw"  # was "adamw": weight decay and momentum apply to used rows only
lr = 1e-3
weight_decay = 0.05    # lr * wd = 5e-5 shrink per step
batch_size = 32
epochs = 100           # a cap; early stopping ends the run
eval_every_targets = 572137  # a quarter of an epoch (2,288,549 targets)
min_checks = 10          # = 2.5 epochs at a quarter epoch per check
patience = 5             # was 10 epochs; now counts validation checks
augment_mask = 0.0      # training-window augmentation off
augment_crop = 0
augment_reorder = 0.0
objective = "every_position"  # was "last_position": predict the next song at every position
softmax = "sampled"       # was "full": each batch scores its true next songs + random songs
sampled_negatives = 8192  # was 1024
negative_power = 0.75     # was 0 (uniform): draw by (target frequency)^0.75
compile = false           # torch.compile off: plain PyTorch
