# The load balancer in front of the front-desk copies (docker compose up --scale frontdesk=N).
worker_processes auto;          # one worker per CPU core
events {
  worker_connections 8192;      # per worker; each user takes one, plus one to a front desk (the default,
}                               # 512 with one worker, dropped connections at 1,000 users)

http {
  upstream frontdesks {
    zone frontdesks 64k;        # shared by every nginx worker, so max_conns is one limit, not one per worker
    least_conn;                 # each request to the copy with the fewest requests in progress
    # Docker's DNS gives one address per copy; nginx resolves it at startup. At most 96 requests in
    # progress per copy: past that a copy is full, and if every copy is, nginx turns the request away
    # itself (@busy), in microseconds, before it can queue inside an overloaded front desk.
    server frontdesk:8000 max_conns=96;
    keepalive 64;               # reuse connections to the copies
  }
  server {
    listen 80;
    location / {
      proxy_pass http://frontdesks;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # a copy that's down or full (503): try one other copy (a recommendation is safe to ask twice)
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      error_page 502 504 = @busy;  # no copy could take it (all full, or down)
    }
    location @busy {
      default_type application/json;
      add_header Retry-After 1 always;
      return 503 '{"detail": {"error": "busy: every front desk is full; try again"}}';
    }
  }
}
