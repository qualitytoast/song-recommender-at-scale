# The load balancer in front of the front-desk copies (docker compose up --scale frontdesk=N).
worker_processes auto;          # one worker per CPU core
events {
  worker_connections 8192;      # per worker; each user takes one, plus one to a front desk (the default,
}                               # 512 with one worker, dropped connections at 1,000 users)

http {
  upstream frontdesks {
    least_conn;                 # each request to the copy with the fewest requests in progress
    server frontdesk:8000;      # Docker's DNS gives one address per copy; nginx resolves it at startup
    keepalive 64;               # reuse connections to the copies
  }
  server {
    listen 80;
    location / {
      proxy_pass http://frontdesks;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502;  # a copy that's down: try the next one
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
    }
  }
}
