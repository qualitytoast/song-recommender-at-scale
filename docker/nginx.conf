# The load balancer in front of the front-desk copies (docker compose up --scale frontdesk=N).
worker_processes auto;          # one worker per CPU core
events {
  worker_connections 8192;      # per worker; each user takes one, plus one to a front desk (the default,
}                               # 512 with one worker, dropped connections at 1,000 users)

http {
  # Per-visitor rate limits, only behind Caddy (the public server): Caddy sets X-Forwarded-For to the
  # visitor's address, and nginx takes the visitor's address from it when it comes from inside Docker's
  # network. Without that header (locally, no Caddy) the key is empty and nothing is limited, so load
  # tests on the Mac aren't throttled. Past the limit (plus a short burst) the answer is 429 at once.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  map $http_x_forwarded_for $visitor { "" ""; default $binary_remote_addr; }
  map $uri $recommend_visitor { /recommend $visitor; default ""; }
  map $uri $songs_visitor { /songs $visitor; default ""; }
  limit_req_zone $recommend_visitor zone=recommend:10m rate=5r/s;   # recommendations per visitor
  limit_req_zone $songs_visitor zone=songs:10m rate=20r/s;          # type-ahead search per visitor
  limit_req_status 429;

  upstream frontdesks {
    zone frontdesks 64k;        # shared by every nginx worker, so max_conns is one limit, not one per worker
    least_conn;                 # each request to the copy with the fewest requests in progress
    # Docker's DNS gives one address per copy; nginx resolves it at startup. At most 96 requests in
    # progress per copy: past that a copy is full, and if every copy is, nginx turns the request away
    # itself (@busy), in microseconds, before it can queue inside an overloaded front desk.
    server frontdesk:8000 max_conns=96;
    keepalive 64;               # reuse connections to the copies
  }
  server {
    listen 80;
    location / {
      limit_req zone=recommend burst=20 nodelay;   # each counts only for its own path (empty key: no limit)
      limit_req zone=songs burst=40 nodelay;
      proxy_pass http://frontdesks;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # a copy that's down or full (503): try one other copy (a recommendation is safe to ask twice)
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 10s;
      error_page 502 504 = @busy;  # no copy could take it (all full, or down)
      error_page 429 = @slow_down; # this visitor is over the rate limit
    }
    location @slow_down {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"detail": {"error": "too many requests from you; slow down"}}';
    }
    location @busy {
      default_type application/json;
      add_header Retry-After 1 always;
      return 503 '{"detail": {"error": "busy: every front desk is full; try again"}}';
    }
  }
}
