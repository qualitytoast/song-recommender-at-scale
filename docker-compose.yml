# The sharded recommender in containers: 4 shard servers (one container each), the front desk behind
# nginx, Redis.
#
#   python -m recsys.shard_slices --bundle bundles/<bundle> --shards 4   # once: the shard slices
#   BUNDLE=./bundles/<bundle> docker compose up --build                  # then http://localhost:8000/docs
#   docker compose up -d --scale frontdesk=3 --scale shard-0=2           # copies (then: docker compose
#                                                                        #   restart nginx, to see them all)
#   REDIS_URL= BATCH=0 docker compose up -d                              # no cache, no batching
#   SEARCH_URL= docker compose up -d                                     # the menu without Meilisearch
#   docker compose run --rm search-index                                 # once per bundle: its search index
#
# BUNDLE is the bundle folder (default below), mounted read-only at /bundle in every container. Each
# shard listens on port 50051 inside its own container and is reached by its service name (shard-0, ...).
# MEILI_MASTER_KEY (in .env, never committed) is Meilisearch's key: any random text of 16+ characters.
x-recommender: &recommender
  build: {context: ., dockerfile: docker/Dockerfile}
  image: song-recommender:latest
  volumes:
    - ${BUNDLE:-./bundles/ranker_1m_lb_next10w-ba9b20873aac}:/bundle:ro
  restart: unless-stopped   # a crashed container is started again
  init: true                # a small init process runs the program, so the program's crash ends the container
  labels:
    recsys.autoheal: "true"  # a frozen (unhealthy) container is restarted by the autoheal service

x-shard-health: &shard-health
  test: ["CMD", "python", "-m", "recsys.healthcheck", "grpc", "localhost:50051"]
  interval: 2s              # checked every 2 s; 2 misses in a row = unhealthy (then autoheal restarts it)
  timeout: 2s
  retries: 2
  start_period: 30s

services:
  shard-0:
    <<: *recommender
    command: python -m recsys.shard --slice /bundle/shards-4/shard-0 --port 50051
    healthcheck: *shard-health
  shard-1:
    <<: *recommender
    command: python -m recsys.shard --slice /bundle/shards-4/shard-1 --port 50051
    healthcheck: *shard-health
  shard-2:
    <<: *recommender
    command: python -m recsys.shard --slice /bundle/shards-4/shard-2 --port 50051
    healthcheck: *shard-health
  shard-3:
    <<: *recommender
    command: python -m recsys.shard --slice /bundle/shards-4/shard-3 --port 50051
    healthcheck: *shard-health

  frontdesk:
    <<: *recommender
    command: >
      python -m recsys.serve --bundle /bundle --host 0.0.0.0 --port 8000 --deadline 0.25
      --shards shard-0:50051,shard-1:50051,shard-2:50051,shard-3:50051
      --redis "${REDIS_URL-redis://redis:6379/0}" --batch ${BATCH:-16} --batch-wait-ms ${BATCH_WAIT_MS:-2}
      --search "${SEARCH_URL-http://meilisearch:7700}"
    environment:
      OMP_NUM_THREADS: "1"  # one request's computations are tiny: splitting them over threads costs more
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    depends_on:
      redis: {condition: service_started}
      meilisearch: {condition: service_started}  # not required: without it the menu uses the name search
      shard-0: {condition: service_healthy}
      shard-1: {condition: service_healthy}
      shard-2: {condition: service_healthy}
      shard-3: {condition: service_healthy}
    healthcheck:  # /live, never stuck behind busy requests: a busy front desk mustn't be restarted
      test: ["CMD", "python", "-m", "recsys.healthcheck", "http", "http://localhost:8000/live"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 60s

  nginx:  # the one public entrance: spreads requests over the front-desk copies
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:80"]
    depends_on:
      frontdesk: {condition: service_healthy}
    restart: unless-stopped

  autoheal:  # restarts containers whose health check fails (Docker itself only restarts ones that exit)
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # lets it manage this machine's containers
    command:
      - sh
      - -c
      - |
        while true; do
          for c in $$(docker ps -q --filter health=unhealthy --filter label=recsys.autoheal=true); do
            echo "$$(date -u +%T) restarting unhealthy $$(docker inspect -f '{{.Name}}' $$c)"
            docker restart -t 2 $$c
          done
          sleep 2
        done
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped   # back after a reboot like the rest (without it the front desks run uncached)

  meilisearch:  # the menu's search engine (recsys/song_search.py); no published port: only the front desks
    image: getmeili/meilisearch:v1.54.3
    environment:
      MEILI_ENV: production               # every request needs the key; no web dashboard
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"          # send no usage data to Meilisearch's makers
      MEILI_MAX_INDEXING_THREADS: ${MEILI_INDEXING_THREADS:-1}  # indexing leaves the other cores to serving
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_INDEXING_MEMORY:-1073741824}  # bytes (1 GiB)
    volumes:
      - meili_data:/meili_data            # the indexes, kept across restarts (one per bundle version)
    restart: unless-stopped

  # One-off: sends the bundle's songs to Meilisearch (recsys/song_search.py; minutes on the server). Its own
  # service, not `run frontdesk`: a copy of the front desk inherits its health check and autoheal label, and
  # gets restarted (from scratch) a minute in. Only started by `docker compose run --rm search-index`.
  search-index:
    image: song-recommender:latest
    profiles: ["tools"]
    volumes:
      - ${BUNDLE:-./bundles/ranker_1m_lb_next10w-ba9b20873aac}:/bundle:ro
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    command: python -m recsys.song_search --bundle /bundle --url http://meilisearch:7700
    depends_on:
      meilisearch: {condition: service_started}

volumes:
  meili_data:
